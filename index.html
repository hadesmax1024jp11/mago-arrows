<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>馬哥箭頭逃脫 · Mago Arrows</title>
<meta name="description" content="一款單檔、離線可玩的箭頭邏輯解謎遊戲。點一下箭頭，它就沿自己的軌道衝出棋盤 —— 前提是前方那條直線完全淨空。">
<meta name="theme-color" content="#3F7D4E">
<style>
/* ============================================================================
   馬哥箭頭逃脫 —— 宣紙／竹綠／金 的自有配色，六組主題
   ========================================================================== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#F8F6F0; --paper2:#F0EDE2; --panel:#FFFFFF; --edge:#E3DFCF;
  --dot:#D8D3C1; --grid:#DCD5C0; --cell:#EDE9DB;
  --ink:#2A3326; --ink2:#6B7264; --ink3:#A3A797;
  --arrow:#2A3326; --key:#3F7D4E; --keyD:#2F6039; --keyL:#E7F0E5;
  --err:#D8503F; --gold:#E0A82E;
  --t0:#5EA06E; --t1:#E0A82E; --t2:#D9772F; --t3:#C0433A;
  --shadow:rgba(58,52,34,.12); --desk:#E4E1D6;
  --appW:430px; --appR:2.1667;
}
html[data-theme="bamboo"]{
  --paper:#F3F7F0; --paper2:#E8F0E4; --panel:#FFFFFF; --edge:#D5E3CF;
  --dot:#C8DCC2; --grid:#CBDFC5; --cell:#E1EEDC; --keyL:#E0F0DE;
  --ink:#1F3324; --ink2:#5B7160; --ink3:#94A897;
  --arrow:#1F3324; --key:#2F8B57; --keyD:#226B42; --desk:#D9E6D4;
}
html[data-theme="roast"]{
  --paper:#F5EFE4; --paper2:#EBE2D2; --panel:#FCF8F1; --edge:#DCCFB8;
  --dot:#D2C3A7; --grid:#D5C7A9; --cell:#E7DCC7; --keyL:#F1E5D2;
  --ink:#3A2A1B; --ink2:#7C6650; --ink3:#B0A08A;
  --arrow:#3A2A1B; --key:#B4712C; --keyD:#8E5620; --desk:#E3D8C4;
}
html[data-theme="night"]{
  --paper:#15201B; --paper2:#1C2B23; --panel:#1C2B23; --edge:#2A3D31;
  --dot:#31473A; --grid:#334B3C; --cell:#243629; --keyL:#1E3E2C;
  --ink:#EAF2E7; --ink2:#9BB0A2; --ink3:#6E8377;
  --arrow:#EAF2E7; --key:#4FB07A; --keyD:#38885C;
  --shadow:rgba(0,0,0,.45); --desk:#0B120E;
}
html[data-theme="ink"]{
  --paper:#141414; --paper2:#1C1C1C; --panel:#1C1C1C; --edge:#2C2C2C;
  --dot:#343434; --grid:#3A3A3A; --cell:#262626; --keyL:#2A2A2A;
  --ink:#F2F0EA; --ink2:#A6A49C; --ink3:#71706A;
  --arrow:#F2F0EA; --key:#C9A227; --keyD:#9E7D18;
  --shadow:rgba(0,0,0,.5); --desk:#000000;
}
html[data-theme="plum"]{
  --paper:#221A26; --paper2:#2C2131; --panel:#2C2131; --edge:#3B2D42;
  --dot:#48364F; --grid:#4B3853; --cell:#372840; --keyL:#3A2748;
  --ink:#F5EAF3; --ink2:#BBA3C0; --ink3:#8A7490;
  --arrow:#F5EAF3; --key:#C56C9B; --keyD:#A24E7C;
  --shadow:rgba(0,0,0,.45); --desk:#150F18;
}
html,body{height:100%;height:100dvh;overflow:hidden}
body{
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  background:var(--desk);color:var(--ink);user-select:none;-webkit-user-select:none;
  display:grid;place-items:center;transition:background .3s}
#app{position:relative;overflow:hidden;container-type:inline-size;
  width:min(100vw,var(--appW));
  height:min(100%,calc(min(100vw,var(--appW))*var(--appR)));
  max-height:100%;
  background:radial-gradient(120% 90% at 50% 0%,var(--paper) 0%,var(--paper2) 100%);
  transition:background .3s}
@media (min-width:520px) and (min-height:600px){
  #app{border-radius:38px;box-shadow:0 26px 60px rgba(40,36,22,.3),0 0 0 1px var(--edge)}
}
#fx{position:absolute;inset:0;pointer-events:none;z-index:60}
.leaf{position:absolute;pointer-events:none;opacity:.06;z-index:0;color:var(--key)}

.screen{position:absolute;inset:0;display:none;flex-direction:column;z-index:2}
.screen.on{display:flex;animation:fade .3s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

/* ---------------- Logo：竹綠圓角章 + 白箭頭 ---------------- */
.logo{display:flex;align-items:center;gap:9px}
.logo .mk{width:38px;height:38px;border-radius:12px;background:var(--key);display:grid;place-items:center;
  box-shadow:0 3px 0 var(--keyD)}
.logo .mk svg{display:block}
.logo b{font-size:17px;font-weight:900;letter-spacing:.02em}
.logo.big .mk{width:54px;height:54px;border-radius:17px}

/* ---------------- 通用元件 ---------------- */
.btn{border:none;cursor:pointer;font:inherit;font-weight:800;color:#fff;background:var(--key);
  padding:15px 44px;border-radius:99px;font-size:18px;letter-spacing:.02em;
  box-shadow:0 4px 0 var(--keyD);transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--keyD)}
.btn.ghost{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1.6px var(--edge)}
.btn.ghost:active{transform:translateY(2px);box-shadow:0 0 0 1.6px var(--edge)}
.btn.sm{padding:11px 24px;font-size:15px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:42px;height:42px;flex:0 0 auto;border-radius:50%;border:none;background:var(--cell);
  cursor:pointer;display:grid;place-items:center;color:var(--ink);transition:transform .08s}
.iconbtn:active{transform:scale(.9)}
.iconbtn.on{background:var(--key);color:#fff}
.iconbtn.badge{position:relative}
.iconbtn.badge b{position:absolute;right:-3px;top:-3px;background:var(--key);color:#fff;font-size:10px;
  min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;font-weight:900;
  padding:0 4px;box-shadow:0 0 0 2.5px var(--paper)}
.iconbtn.tiny{width:36px;height:36px}
.iconbtn.tiny svg{width:17px;height:17px}
.chip{background:var(--cell);border-radius:99px;padding:7px 14px;font-weight:800;font-size:14px;color:var(--ink)}
.chip.diff{color:#fff;font-size:12.5px;letter-spacing:.02em;padding:8px 13px}
.h2{font-size:23px;font-weight:900}
.sub{color:var(--ink2);font-size:13px;line-height:1.6}
.topbar{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;flex:0 0 auto}
.topbar .ttl{font-size:19px;font-weight:900;flex:1;text-align:center}
.spacer{flex:1}
.bar{height:7px;border-radius:99px;background:var(--cell);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--key);transition:width .35s}

/* ---------------- 首頁 ---------------- */
#home{align-items:center;padding:0 22px calc(20px + env(safe-area-inset-bottom))}
#home .top{padding-top:calc(26px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center}
#home h1{font-size:clamp(28px,8.6cqw,42px);font-weight:900;line-height:1.05;text-align:center;margin-top:12px}
#home .tag{color:var(--ink3);font-size:11px;letter-spacing:.3em;text-align:center;margin-top:6px}
.hero{width:min(46cqw,200px);max-height:25vh;object-fit:contain;display:block;margin:8px auto 0;
  filter:drop-shadow(0 14px 18px rgba(58,52,34,.22));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-.7deg)}50%{transform:translateY(-10px) rotate(.7deg)}}
.homebtns{width:100%;display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:auto}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;margin-top:4px}
.tile{background:var(--panel);border-radius:20px;padding:13px 14px;text-align:left;cursor:pointer;
  border:none;font:inherit;color:var(--ink);position:relative;transition:transform .08s;
  box-shadow:0 2px 0 var(--edge)}
.tile:active{transform:scale(.975)}
.tile b{display:block;font-size:15px;font-weight:900}
.tile span{display:block;font-size:11px;color:var(--ink2);margin-top:2px;font-weight:700}
.tile.off,.tile.off b{color:var(--ink3)}
.stats{display:flex;gap:20px;justify-content:center;color:var(--ink3);font-size:11px;font-weight:800;margin-top:14px}
.stats b{display:block;color:var(--ink);font-size:19px;font-weight:900}

/* ---------------- 關卡地圖 ---------------- */
#map .scroll{padding:4px 0 calc(26px + env(safe-area-inset-bottom))}
.mapwrap{position:relative;padding:14px 0}
.mapline{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;
  background:repeating-linear-gradient(180deg,var(--edge) 0 7px,transparent 7px 15px)}
.node{position:relative;display:flex;align-items:center;height:64px;justify-content:center}
.node .nd{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:900;
  font-size:17px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.16);cursor:pointer;position:relative;z-index:1}
.node .nd.locked{background:var(--cell);color:var(--ink3);box-shadow:none;cursor:default}
.node .nd.cur{outline:3.5px solid var(--paper);box-shadow:0 0 0 6px var(--key),0 3px 0 rgba(0,0,0,.16);
  animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.node .side{position:absolute;font-size:11px;font-weight:800;color:var(--ink2);white-space:nowrap}
.node .side.l{right:calc(50% + 42px);text-align:right}
.node .side.r{left:calc(50% + 42px)}
.node .shp{position:absolute;left:50%;margin-left:14px;top:6px;font-size:12px;color:var(--gold)}
.node .stars{position:absolute;left:50%;transform:translateX(-50%);bottom:2px;display:flex;gap:1.5px}
.node .stars i{width:6px;height:6px;border-radius:50%;background:var(--gold);display:block}
.node .stars i.off{background:var(--edge)}
.node.big .nd{width:62px;height:62px;font-size:19px}
.mapfoot{text-align:center;color:var(--ink3);font-size:12px;font-weight:700;padding:10px 0 0}

/* ---------------- 遊戲畫面 ---------------- */
#game{padding:calc(9px + env(safe-area-inset-top)) 11px calc(8px + env(safe-area-inset-bottom))}
.hud{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.hearts{display:flex;gap:2px;align-items:center}
.heart{width:19px;height:19px;transition:transform .25s,opacity .25s}
.heart.gone{opacity:.22;transform:scale(.7)}
.heart.pulse{animation:hpop .45s ease}
@keyframes hpop{0%{transform:scale(1)}35%{transform:scale(1.45) rotate(-12deg)}100%{transform:scale(.7)}}
.progrow{display:flex;align-items:center;gap:7px;margin:8px 2px 0;flex:0 0 auto}
.progwrap{flex:1;height:5px;background:var(--cell);border-radius:99px;overflow:hidden}
.progbar{height:100%;width:0;border-radius:99px;background:var(--key);transition:width .3s}
#boardWrap{flex:1;position:relative;min-height:0;overflow:hidden;touch-action:none}
#boardWrap.pannable{cursor:grab}
#boardWrap.panning{cursor:grabbing}
#boardPanel{position:absolute;left:0;top:0;transform-origin:0 0;padding:10px;
  background:var(--panel);border-radius:22px;box-shadow:0 6px 20px var(--shadow)}
#board{position:relative}
#gridc,#dots{position:absolute;inset:0;pointer-events:none}
#pieces{position:absolute;left:0;top:0;overflow:visible}
.pc .hit{fill:none;stroke:transparent;pointer-events:stroke;cursor:pointer}
.pc .ln{fill:none;stroke:var(--arrow);stroke-linecap:butt;stroke-linejoin:round;pointer-events:none}
.pc .hd{fill:var(--arrow);stroke:none;pointer-events:none}
.pc.bad .ln{stroke:var(--err)} .pc.bad .hd{fill:var(--err)}
.pc.tip .ln{stroke:var(--key)} .pc.tip .hd{fill:var(--key)}
.pc.sel .ln{stroke:var(--key)} .pc.sel .hd{fill:var(--key)}
.pc.tip{animation:tip 1s ease-in-out infinite}
@keyframes tip{0%,100%{opacity:1}50%{opacity:.4}}
#guide{position:absolute;inset:0;pointer-events:none}
.pathdot{position:absolute;border-radius:50%;background:var(--key);opacity:.28;pointer-events:none}
.blockx{position:absolute;pointer-events:none;color:var(--err);display:grid;place-items:center;font-weight:900}
#praise{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:26px;font-weight:900;
  color:var(--ink);opacity:0;pointer-events:none;z-index:8}
#praise.on{animation:praise 1.15s ease-out both}
@keyframes praise{0%{opacity:0;transform:scale(.6)}22%{opacity:1;transform:scale(1.08)}
  70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1) translateY(-18px)}}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
  background:var(--keyL);color:var(--key);font-weight:800;font-size:12.5px;
  padding:8px 15px;border-radius:99px;opacity:0;transition:opacity .28s;pointer-events:none;
  max-width:92%;text-align:center}
#toast.on{opacity:1}
#combo{position:absolute;right:12px;bottom:12px;font-weight:900;font-size:14px;color:var(--key);
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:5}
#combo.on{opacity:1}
.float{position:absolute;pointer-events:none;font-weight:900;z-index:70;animation:floatUp .9s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.7)}
  25%{opacity:1;transform:translate(-50%,-13px) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,-58px) scale(1)}}

/* ---------------- 馬哥 ---------------- */
#mascot{position:absolute;pointer-events:none;z-index:6;opacity:0;
  transition:opacity .3s ease,transform .46s cubic-bezier(.2,1.35,.4,1)}
#mascot.on{opacity:1}
#mascot img{display:block;width:100%;height:auto;
  filter:drop-shadow(0 7px 11px rgba(58,52,34,.26));animation:msbob 1.6s ease-in-out infinite}
@keyframes msbob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
#mascot.flip img{animation-name:msbobF}
@keyframes msbobF{0%,100%{transform:scaleX(-1) translateY(0) rotate(1.5deg)}50%{transform:scaleX(-1) translateY(-6px) rotate(-1.5deg)}}
.mbub{position:absolute;white-space:nowrap;box-sizing:border-box;background:var(--panel);
  border:1.6px solid var(--edge);border-radius:15px;padding:7px 12px;font-size:13px;font-weight:800;
  line-height:1.35;color:var(--ink);box-shadow:0 5px 12px var(--shadow);
  animation:bubIn .3s cubic-bezier(.2,1.6,.4,1) both}
.mbub::after{content:"";position:absolute;width:11px;height:11px;background:var(--panel);transform:rotate(45deg)}
.mbub.t-d::after{bottom:-6.5px;left:17px;border-right:1.6px solid var(--edge);border-bottom:1.6px solid var(--edge)}
.mbub.t-l::after{left:-6.5px;top:11px;border-left:1.6px solid var(--edge);border-bottom:1.6px solid var(--edge)}
.mbub.t-r::after{right:-6.5px;top:11px;border-right:1.6px solid var(--edge);border-top:1.6px solid var(--edge)}
@keyframes bubIn{from{opacity:0;transform:scale(.62)}to{opacity:1;transform:none}}

/* ---------------- 每日一關 ---------------- */
.cal{padding:0 18px}
.calhead{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 12px}
.calhead b{font-size:17px;font-weight:900;color:var(--key);min-width:132px;text-align:center}
.calnav{width:32px;height:32px;border-radius:50%;border:none;background:var(--cell);color:var(--ink);
  cursor:pointer;display:grid;place-items:center;font-size:17px}
.calnav[disabled]{opacity:.3;pointer-events:none}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.calgrid .dow{font-size:11px;font-weight:800;color:var(--ink3);padding-bottom:3px}
.day{aspect-ratio:1;border-radius:11px;background:var(--cell);display:grid;place-items:center;
  font-size:13px;font-weight:800;color:var(--ink2);cursor:pointer;position:relative}
.day.blank{background:transparent;cursor:default}
.day.future{opacity:.4;cursor:default}
.day.done{background:var(--key);color:#fff}
.day.today{box-shadow:0 0 0 2.2px var(--key)}
.day.done::after{content:"";position:absolute;right:3px;bottom:3px;width:5px;height:5px;border-radius:50%;background:#fff}
.calbar{display:flex;align-items:center;gap:9px;margin:2px 0 14px;font-size:11px;font-weight:800;color:var(--ink3)}
.calbar .bar{flex:1}
.calbar .n{width:22px;height:22px;border-radius:50%;background:var(--t0);color:#fff;display:grid;place-items:center;font-size:11px}
.cd{text-align:center;color:var(--ink2);font-size:12px;font-weight:800;margin-top:12px}

/* ---------------- 成就 / 週榜 ---------------- */
.awlist,.lglist{padding:0 16px calc(24px + env(safe-area-inset-bottom))}
.aw{display:flex;gap:12px;align-items:center;background:var(--panel);border-radius:18px;padding:12px 14px;
  margin-bottom:8px;box-shadow:0 2px 0 var(--edge)}
.aw .ic{width:42px;height:42px;flex:0 0 auto;border-radius:13px;background:var(--keyL);display:grid;place-items:center;font-size:20px}
.aw.done .ic{background:var(--t0);color:#fff}
.aw .tx{flex:1;min-width:0}
.aw .tx b{display:block;font-size:14px;font-weight:900}
.aw .tx span{display:block;font-size:11px;color:var(--ink2);font-weight:700;margin:2px 0 5px}
.aw .n{font-size:11px;font-weight:900;color:var(--ink3);flex:0 0 auto}
.lgrow{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:15px;margin-bottom:5px;
  background:var(--panel);box-shadow:0 2px 0 var(--edge)}
.lgrow.me{background:var(--keyL);box-shadow:inset 0 0 0 1.6px var(--key)}
.lgrow.up{background:linear-gradient(90deg,var(--keyL),var(--panel))}
.lgrow .r{width:26px;font-weight:900;font-size:14px;color:var(--ink2);text-align:center;flex:0 0 auto}
.lgrow .nm{flex:1;font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgrow .sc{font-weight:900;font-size:14px}
.lgtitle{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 12px}
.zone{font-size:10.5px;font-weight:900;color:var(--t0);letter-spacing:.06em;padding:8px 16px 4px}

/* ---------------- 彈窗 ---------------- */
#modal{position:fixed;inset:0;background:rgba(34,30,18,.45);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:80;padding:22px}
#modal.on{display:flex;animation:fade .22s ease both}
.card{background:var(--panel);border-radius:28px;padding:24px 22px 20px;text-align:center;
  max-width:344px;width:100%;max-height:88vh;overflow-y:auto;
  box-shadow:0 22px 46px rgba(34,30,18,.3);animation:pop .34s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(.84) translateY(16px);opacity:0}to{transform:none;opacity:1}}
.card img.pm{width:104px;max-height:130px;object-fit:contain;margin:-4px auto 2px;display:block;
  filter:drop-shadow(0 9px 12px rgba(58,52,34,.24))}
.card h2{font-size:24px;font-weight:900;margin-bottom:3px}
.card p{color:var(--ink2);font-size:13.5px;line-height:1.6;margin-bottom:14px}
.stars{display:flex;gap:7px;justify-content:center;margin:6px 0 10px}
.stars svg{width:33px;height:33px;animation:starIn .45s cubic-bezier(.2,1.6,.4,1) both}
.stars svg:nth-child(2){animation-delay:.11s}
.stars svg:nth-child(3){animation-delay:.22s}
.stars .off{opacity:.2}
@keyframes starIn{from{transform:scale(0) rotate(-70deg)}to{transform:none}}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:2px 0 15px}
.kv div{background:var(--paper2);border-radius:14px;padding:9px 6px}
.kv small{display:block;font-size:10px;color:var(--ink3);font-weight:800;letter-spacing:.04em}
.kv b{display:block;font-size:16px;font-weight:900;margin-top:1px}
.cardbtns{display:flex;flex-direction:column;gap:8px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px;
  border-bottom:1px solid var(--edge);font-size:14.5px;font-weight:800;text-align:left}
.setrow:last-of-type{border-bottom:none}
.setrow .sd{font-size:11px;color:var(--ink2);font-weight:700;margin-top:2px}
.sw{width:48px;height:28px;border-radius:99px;background:var(--cell);position:relative;cursor:pointer;
  flex:0 0 auto;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 1.5px 4px rgba(0,0,0,.22);transition:transform .2s}
.sw.on{background:var(--key)}
.sw.on::after{transform:translateX(20px)}
.seg{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.seg button{border:none;font:inherit;font-weight:800;font-size:11.5px;padding:6px 10px;border-radius:99px;
  background:var(--cell);color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--key);color:#fff}
.tut{background:var(--paper2);border-radius:16px;padding:13px 14px;text-align:left;font-size:13px;
  line-height:1.72;color:var(--ink2);margin-bottom:13px}
.tut b{color:var(--ink)}
.tut .mini{font-size:11.5px;color:var(--ink3)}

/* ---------------- 載入 / 生成中 ---------------- */
#splash,#gen{position:absolute;inset:0;display:grid;place-items:center;z-index:90;background:var(--paper)}
#splash.off,#gen.off{display:none}
#gen{background:rgba(248,246,240,.86);z-index:75}
html[data-theme="night"] #gen,html[data-theme="ink"] #gen,html[data-theme="plum"] #gen{background:rgba(20,20,20,.8)}
#splash .lt,#gen .lt{margin-top:14px;color:var(--ink3);font-size:12px;font-weight:800;letter-spacing:.12em;text-align:center}
.spin{width:26px;height:26px;margin:0 auto;border-radius:50%;border:3px solid var(--edge);
  border-top-color:var(--key);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
</style>
</head>
<body>
<div id="app">
<canvas id="fx"></canvas>

<!-- ============================ 首頁 ============================ -->
<section id="home" class="screen">
  <div class="top">
    <div class="logo big">
      <div class="mk"><svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="#fff"
        stroke-width="3.4" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M6 26V13h13"/><path d="M14 8l6 5-6 5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <h1 id="hTitle">馬哥箭頭逃脫</h1>
    <div class="tag">M A G O &nbsp; A R R O W S</div>
  </div>
  <img class="hero" id="heroImg" alt="馬哥">
  <div class="homebtns">
    <button class="btn wide" id="btnPlay">開始遊戲</button>
    <div class="tiles">
      <button class="tile" id="tMap"><b id="tMapT">關卡</b><span id="tMapS">第 1 關</span></button>
      <button class="tile" id="tDaily"><b id="tDailyT">每日一關</b><span id="tDailyS">—</span></button>
      <button class="tile" id="tAward"><b id="tAwardT">成就</b><span id="tAwardS">—</span></button>
      <button class="tile" id="tLeague"><b id="tLeagueT">週榜</b><span id="tLeagueS">—</span></button>
    </div>
    <div class="stats">
      <div id="sLvW">關卡<b id="stLv">1</b></div>
      <div id="sScW">分數<b id="stSc">0</b></div>
      <div id="sCbW">連擊<b id="stCb">0</b></div>
      <div id="sArW">箭頭<b id="stAr">0</b></div>
    </div>
    <div style="display:flex;gap:9px;margin-top:12px">
      <button class="btn ghost sm" id="btnHow">怎麼玩</button>
      <button class="btn ghost sm" id="btnSet">設定</button>
    </div>
  </div>
</section>

<!-- ============================ 關卡地圖 ============================ -->
<section id="map" class="screen">
  <div class="topbar">
    <button class="iconbtn" data-back="home">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl" id="mapTtl">關卡</div>
    <button class="iconbtn" id="mapJump" title="回到目前關卡">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button>
  </div>
  <div class="scroll" id="mapScroll"><div class="mapwrap" id="mapWrap"><div class="mapline"></div></div>
    <div class="mapfoot" id="mapFoot"></div></div>
</section>

<!-- ============================ 遊戲 ============================ -->
<section id="game" class="screen">
  <div class="hud">
    <button class="iconbtn" id="btnBack">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="chip" id="lvChip">第 1 關</div>
    <div class="chip diff" id="diffChip">悠閒</div>
    <div class="spacer"></div>
    <div class="chip" style="padding:6px 10px"><div class="hearts" id="hearts"></div></div>
    <button class="iconbtn badge" id="btnHint" title="提示">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.5.4.8 1 .8 1.6v.5h5.4v-.5c0-.6.3-1.2.8-1.6A6 6 0 0012 3z"/></svg>
      <b id="hintN">3</b></button>
  </div>
  <div class="progrow">
    <div class="progwrap"><div class="progbar" id="prog"></div></div>
    <button class="iconbtn tiny" id="btnGrid" title="格線">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round"><path d="M4 9h16M4 15h16M9 4v16M15 4v16"/></svg></button>
    <button class="iconbtn tiny" id="btnFit" title="整盤 / 放大">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="iconbtn tiny" id="btnRestart" title="重來">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"><path d="M20 11A8 8 0 106.3 6.3M20 4v6h-6"/></svg></button>
  </div>
  <div id="boardWrap">
    <div id="boardPanel"><div id="board">
      <canvas id="gridc"></canvas>
      <canvas id="dots"></canvas>
      <svg id="pieces" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="guide"></div>
    </div></div>
    <div id="mascot"><div class="mbub t-d" id="mbub"></div><img id="mimg" alt="馬哥"></div>
    <div id="praise"></div>
    <div id="combo"></div>
    <div id="toast"></div>
  </div>
</section>

<!-- ============================ 每日一關 ============================ -->
<section id="daily" class="screen">
  <div class="topbar">
    <button class="iconbtn" data-back="home">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl" id="dailyTtl">每日一關</div>
    <div style="width:42px"></div>
  </div>
  <div class="scroll"><div class="cal" id="calBody"></div></div>
</section>

<!-- ============================ 成就 ============================ -->
<section id="awards" class="screen">
  <div class="topbar">
    <button class="iconbtn" data-back="home">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl" id="awTtl">成就</div>
    <div style="width:42px"></div>
  </div>
  <div class="scroll"><div class="awlist" id="awBody"></div></div>
</section>

<!-- ============================ 週榜 ============================ -->
<section id="leagues" class="screen">
  <div class="topbar">
    <button class="iconbtn" data-back="home">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl" id="lgTtl">週榜</div>
    <div style="width:42px"></div>
  </div>
  <div class="lgtitle"><div class="sub" id="lgSub"></div><div class="chip" id="lgTop">—</div></div>
  <div class="scroll"><div class="lglist" id="lgBody"></div></div>
</section>

<div id="gen" class="off"><div><div class="spin"></div><div class="lt" id="genTxt">生成關卡中…</div></div></div>
<div id="splash">
  <div>
    <div class="logo big" style="justify-content:center">
      <div class="mk"><svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="#fff"
        stroke-width="3.4" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M6 26V13h13"/><path d="M14 8l6 5-6 5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <div class="lt" id="splashTxt">載入中…</div>
  </div>
</div>
</div>
<div id="modal"><div class="card" id="cardBody"></div></div>

  const H = Math.min(54, Math.round(W * 1.36));
  return { cols: W, rows: H, shape: null, passes };
}

/* ---------- 可解性驗證（盯梢法） ----------
   每條蛇只記「第一個擋住我的是誰」，那個人走掉才重算。
   盤面大到 40×54（幾百條蛇）時比每步重掃全部快一個數量級。 */
function solvableLv(lv) {
  const cols = lv.cols, rows = lv.rows, k = lv.pieces.length, ix = (x, y) => y * cols + x;
  const own = new Int32Array(cols * rows).fill(-1);
  for (let i = 0; i < k; i++) for (const [x, y] of lv.pieces[i].cells) own[ix(x, y)] = i;
  const blocker = i => {
    const p = lv.pieces[i], [dx, dy] = GDV[p.d];
    let x = p.cells[0][0] + dx, y = p.cells[0][1] + dy;
    while (x >= 0 && y >= 0 && x < cols && y < rows) {
      const o = own[ix(x, y)]; if (o !== -1) return o; x += dx; y += dy;
    }
    return -1;
  };
  const watch = [], ready = [], gone = new Uint8Array(k);
  for (let i = 0; i < k; i++) watch.push([]);
  for (let i = 0; i < k; i++) {
    const b = blocker(i);
    if (b === -1) ready.push(i); else watch[b].push(i);
  }
  let out = 0;
  while (ready.length) {
    const i = ready.pop(); if (gone[i]) continue;
    gone[i] = 1; out++;
    for (const [x, y] of lv.pieces[i].cells) own[ix(x, y)] = -1;
    const w = watch[i]; watch[i] = [];
    for (const j of w) {
      if (gone[j]) continue;
      const b = blocker(j);
      if (b === -1) ready.push(j); else watch[b].push(j);
    }
  }
  return out === k;
}
/* 走一遍解法，量「任何時刻可走幾支」—— 邏輯難度就看這個數字 */
function branchProfile(lv) {
  const cols = lv.cols, rows = lv.rows, k = lv.pieces.length, ix = (x, y) => y * cols + x;
  const own = new Int32Array(cols * rows).fill(-1);
  for (let i = 0; i < k; i++) for (const [x, y] of lv.pieces[i].cells) own[ix(x, y)] = i;
  const blocker = i => {
    const p = lv.pieces[i], [dx, dy] = GDV[p.d];
    let x = p.cells[0][0] + dx, y = p.cells[0][1] + dy;
    while (x >= 0 && y >= 0 && x < cols && y < rows) {
      const o = own[ix(x, y)]; if (o !== -1) return o; x += dx; y += dy;
    }
    return -1;
  };
  const watch = [], gone = new Uint8Array(k), ready = [];
  for (let i = 0; i < k; i++) watch.push([]);
  for (let i = 0; i < k; i++) {
    const b = blocker(i);
    if (b === -1) ready.push(i); else watch[b].push(i);
  }
  let first = 0, sum = 0, st = 0, left = k, mn = 1e9;
  while (ready.length) {
    const av = ready.length;
    if (!st) first = av;
    if (left >= 3) mn = Math.min(mn, av);
    sum += av; st++;
    const i = ready.pop(); gone[i] = 1; left--;
    for (const [x, y] of lv.pieces[i].cells) own[ix(x, y)] = -1;
    const w = watch[i]; watch[i] = [];
    for (const j of w) {
      if (gone[j]) continue;
      const b = blocker(j);
      if (b === -1) ready.push(j); else watch[b].push(j);
    }
  }
  return left === 0 ? { first, min: mn === 1e9 ? first : mn, avg: sum / st } : null;
}

/* ---------- 補洞 ----------
   貪心塞到最後一定會剩幾個洞（新蛇至少兩格，且頭部前方要淨空）。
   對每個空格輪流試三種補法，每補一格就重跑可解性驗證，破壞解法就退回換下一種：
     1. 接在某條蛇的尾端（頭與方向不變）
     2. 接在某條蛇的頭前面 —— 那一格變成新的頭，出場方向跟著轉向
     3. 兩個相鄰空格配成一條新的兩格蛇
   加上第 2 種之後，8×8 的一次成功率從 22% 跳到 99%。 */
function holesOf(lv) {
  const s = new Set();
  for (const p of lv.pieces) for (const [x, y] of p.cells) s.add(x + ',' + y);
  const out = [];
  for (let y = 0; y < lv.rows; y++) for (let x = 0; x < lv.cols; x++)

    let progress = false;
    for (const [x, y] of holes) {
      if (!hset.has(x + ',' + y)) continue;
      const ops = [];
      for (const p of lv.pieces) {
        if (p.cells.length >= maxLen) continue;
        const t = p.cells[p.cells.length - 1], h = p.cells[0];
        if (Math.abs(t[0] - x) + Math.abs(t[1] - y) === 1) ops.push({ tail: p });
        if (Math.abs(h[0] - x) + Math.abs(h[1] - y) === 1) ops.push({ head: p });
      }
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const ax = x + dx, ay = y + dy;
        if (!hset.has(ax + ',' + ay)) continue;
        ops.push({ pair: [[x, y], [ax, ay]] }); ops.push({ pair: [[ax, ay], [x, y]] });
      }
      for (let k = ops.length - 1; k > 0; k--) { const r = RI(k + 1); [ops[k], ops[r]] = [ops[r], ops[k]]; }
      // 盡量別造出「頭貼邊界朝外」的蛇：那種蛇開局一定能走，開局解法數就是被它撐起來的
      const off = (hx, hy, d) => {
        const [dx, dy] = GDV[d], nx = hx + dx, ny = hy + dy;

        if (op.tail) return false;
        if (op.head) {
          const oh = op.head.cells[0];
          const d = GDIR.find(k => GDV[k][0] === x - oh[0] && GDV[k][1] === y - oh[1]);
          return d ? off(x, y, d) : false;
        }
        const [h, b] = op.pair;
        const d = GDIR.find(k => GDV[k][0] === h[0] - b[0] && GDV[k][1] === h[1] - b[1]);
        return d ? off(h[0], h[1], d) : false;
      };

        const cs = op.tail ? p.cells.concat([[x, y]]) : [[x, y]].concat(p.cells);
        return cs.every(c => c[0] === cs[0][0]) || cs.every(c => c[1] === cs[0][1]);
      };
      ops.sort((a, b) => (opens(a) ? 2 : 0) + (mkStraight(a) ? 1 : 0)
        - ((opens(b) ? 2 : 0) + (mkStraight(b) ? 1 : 0)));
      let done = false;
      for (const op of ops) {
        if (op.tail) {
          op.tail.cells.push([x, y]);
          if (solvableLv(lv)) { done = true; break; }
          op.tail.cells.pop();
        } else if (op.head) {
          const p = op.head, old = p.d, oh = p.cells[0];
          p.cells.unshift([x, y]);
          p.d = GDIR.find(k => GDV[k][0] === x - oh[0] && GDV[k][1] === y - oh[1]);
          if (solvableLv(lv)) { done = true; break; }
          p.cells.shift(); p.d = old;
        } else {
          const [h, b] = op.pair;
          const d = GDIR.find(k => GDV[k][0] === h[0] - b[0] && GDV[k][1] === h[1] - b[1]);
          lv.pieces.push({ cells: [h.slice(), b.slice()], d });
          if (solvableLv(lv)) {
            done = true;
            hset.delete(h[0] + ',' + h[1]); hset.delete(b[0] + ',' + b[1]);
            break;
          }
          lv.pieces.pop();
        }
      }
      if (done) { hset.delete(x + ',' + y); progress = true; } else left.push([x, y]);
    }
    holes = left.filter(h => hset.has(h[0] + ',' + h[1]));
    if (!progress) break;
  }
  return holes.length;
}

/* ---------- 產生一關 ---------- */
function genOnce(n) {
  const pl = levelPlan(n), cols = pl.cols, rows = pl.rows, N = cols * rows;
  const mask = pl.shape ? shapeMask(pl.shape, cols) : new Uint8Array(N).fill(1);
  const grid = new Int16Array(N).fill(-1);

  const inB = (x, y) => x >= 0 && y >= 0 && x < cols && y < rows;
  const pieces = [];
  const ray = (x, y, d) => {
    const [dx, dy] = GDV[d], out = [];
    let cx = x + dx, cy = y + dy;
    while (inB(cx, cy)) { if (grid[idx(cx, cy)] !== -1) return null; out.push(idx(cx, cy)); cx += dx; cy += dy; }
    return out;
  };
  const bc = new Int16Array(N);          // 在此格放東西會新擋住幾條現有的蛇
  const recalc = () => {
    bc.fill(0);
    for (const p of pieces) {
      const [hx, hy] = p.cells[0], [dx, dy] = GDV[p.d];
      let cx = hx + dx, cy = hy + dy;
      while (inB(cx, cy)) { if (grid[idx(cx, cy)] !== -1) break; bc[idx(cx, cy)]++; cx += dx; cy += dy; }
    }
  };
  let playable = 0; for (let i = 0; i < N; i++) playable += mask[i];
  const SAMPLE = N > 420 ? 420 : 0;      // 大盤面窮舉每一格太慢，抽樣，品質幾乎不受影響
  const brushes = (pl.passes || ['P']).map(k => BRUSH[k] || BRUSH.P);
  const capLen = Math.max(4, Math.round((cols + rows) * 0.7));
  const BIAS = 24;                       // 落點偏好「會擋住最多同伴」的程度，越大越難
  let guard = 40000;
  while (guard-- > 0) {
    let filled = 0; for (const p of pieces) filled += p.cells.length;
    const cur = brushes[Math.min(brushes.length - 1, Math.floor(filled / Math.max(1, playable) * brushes.length))];
    const wgt = cur.w, len = [Math.min(cur.len[0], capLen - 1), Math.min(cur.len[1], capLen)];
    recalc();
    const empt = [];
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++)
      if (mask[idx(x, y)] && grid[idx(x, y)] === -1) empt.push([x, y]);
    if (SAMPLE && empt.length > SAMPLE) {
      for (let i = 0; i < SAMPLE; i++) { const j = i + RI(empt.length - i); const t = empt[i]; empt[i] = empt[j]; empt[j] = t; }
      empt.length = SAMPLE;
    }
    const cands = [];
    for (const [x, y] of empt) for (let k = 0; k < 4; k++) {
      const rr = ray(x, y, GDIR[k]);
      if (!rr) continue;
      // 射線上「將來還可能被佔住」的格子只有遮罩內的那些。
      // 頭貼著邊界朝外（射線長度 0）、或圖形關裡頭朝著遮罩外的空白區，
      // 都是「之後永遠擋不住」→ 開局一定能走，這種落點排到最後面，
      // 開局的解法數才壓得下來（但不能完全不用，盤面填滿時總得有人先走）。
      let useful = 0;
      for (const c of rr) if (mask[c]) useful++;
      cands.push({ x, y, d: GDIR[k], rr, sc: useful ? bc[idx(x, y)] + 1 : 0 });
    }
    if (!cands.length) break;
    let maxSc = 0; for (const q of cands) if (q.sc > maxSc) maxSc = q.sc;
    const pos = new Int32Array(maxSc + 1), ordered = new Array(cands.length);
    for (const q of cands) pos[q.sc]++;
    let acc = 0; for (let s = maxSc; s >= 0; s--) { const n0 = pos[s]; pos[s] = acc; acc += n0; }
    for (const q of cands) ordered[pos[q.sc]++] = q;
    let placed = false;
    for (let att = 0; att < 40 && ordered.length && !placed; att++) {
      const pick = Math.floor(Math.pow(rnd(), BIAS) * ordered.length);
      const c = ordered[pick] || ordered[0];
      ordered.splice(ordered.indexOf(c), 1);
      const onRay = new Set(c.rr);
      const cells = [[c.x, c.y]], used = new Set([idx(c.x, c.y)]);
      const target = Math.max(2, len[0] + RI(Math.max(1, len[1] - len[0] + 1)));
      let cur2 = [c.x, c.y], back = GOPP[c.d];
      while (cells.length < target) {
        const opts = [];
        for (const nd of GDIR) {
          if (nd === GOPP[back]) continue;                     // 不能立刻折回上一格
          const nx = cur2[0] + GDV[nd][0], ny = cur2[1] + GDV[nd][1], id2 = idx(nx, ny);
          if (!inB(nx, ny) || !mask[id2] || grid[id2] !== -1 || used.has(id2) || onRay.has(id2)) continue;
          opts.push([nd, nx, ny, id2]);
        }
        if (!opts.length) break;
        let pickOpt;
        if (cells.length === 1) {
          pickOpt = opts.find(o => o[0] === back);             // 第一節必在頭的正後方
          if (!pickOpt) break;
        } else {
          const ri = GDIR[(GDIR.indexOf(back) + 1) % 4], le = GDIR[(GDIR.indexOf(back) + 3) % 4];
          const bag = [[ri, wgt[0]], [back, wgt[1]], [le, wgt[2]]].filter(b => opts.some(o => o[0] === b[0]));
          const tot = bag.reduce((a, b) => a + b[1], 0);
          let r2 = rnd() * tot, want2 = null;
          for (const b of bag) { r2 -= b[1]; if (r2 <= 0) { want2 = b[0]; break; } }
          pickOpt = opts.find(o => o[0] === want2) || opts[RI(opts.length)];
        }
        cells.push([pickOpt[1], pickOpt[2]]); used.add(pickOpt[3]);
        cur2 = [pickOpt[1], pickOpt[2]]; back = pickOpt[0];
      }
      if (cells.length < 2) continue;                          // 長度 1 的箭頭一律丟掉
      const id = pieces.length;
      for (const [cx, cy] of cells) grid[idx(cx, cy)] = id;
      pieces.push({ cells, d: c.d });

}

/* 候選裡挑「平均可走箭頭數最接近 FLAT」的那個 —— 邏輯難度要壓成一條平線：
   箭頭數放大幾十倍，任一時刻可走的仍然只有兩三支，難度來自視覺搜尋而不是推理深度。 */
const FLAT = 2.8;          // 任一時刻可走的箭頭數要壓在這附近
const OPENCAP = 8;         // 開局可走的箭頭數超過這個就開始扣分
function generate(n, tries) {
  seedRnd(hash32(n, 0x9E3779B1));
  let best = null;
  for (let t = 0; t < (tries || 8); t++) {
    const lv = genOnce(n);
    const holes = stuff(lv, 12);
    if (!solvableLv(lv)) continue;
    const b = branchProfile(lv);
    if (!b) continue;
    const sc = holes * 1.5                        // 洞沒補滿最傷（會拖過一片空地）
      + Math.abs(b.avg - FLAT)                    // 邏輯難度要平
      + Math.max(0, b.first - OPENCAP) * 0.12;    // 開局選擇太多就不用找了
    if (!best || sc < best.sc) best = { lv, sc, b };
    if (sc < 0.35) break;
  }
  const lv = best ? best.lv : genOnce(n);
  const cells = lv.pieces.reduce((a, p) => a + p.cells.length, 0);
  return {
    cols: lv.cols, rows: lv.rows, cells,
    pieces: lv.pieces.map(p => ({ cells: p.cells, d: p.d })),
    shaped: !!levelPlan(n).shape
  };
}

/* ==========================================================================
   3 / 4　引擎：盤面渲染、規則、動畫、平移縮放、馬哥
   ========================================================================== */

const board = $('board'), panel = $('boardPanel'), svg = $('pieces'),
  dots = $('dots'), gridc = $('gridc'), guide = $('guide'), APP = $('app');
const NS = 'http://www.w3.org/2000/svg';
const DV = { up: [0, -1], right: [1, 0], down: [0, 1], left: [-1, 0] };   // 畫面座標（y 往下）
let G = null;

/* 格距：先求「整盤放得進畫面」的大小，再夾在 20～54 之間。
   縮不下去時靠 zoom（下限＝整盤剛好看得完）＋拖曳平移。 */
const MINCELL = 20, MAXCELL = 54, ZMAX = 2.5;
function cellSize() {
  const wrap = $('boardWrap');
  const pad = 20 + 8;
  const availW = wrap.clientWidth - pad, availH = wrap.clientHeight - pad;
  const fit = Math.floor(Math.min(availW / (G ? G.cols : 8), availH / (G ? G.rows : 8)));
  return clamp(fit, MINCELL, MAXCELL);
}
function panelSize() {
  return { w: panel.offsetWidth || (G.cell * G.cols + 20), h: panel.offsetHeight || (G.cell * G.rows + 20) };
}
function zoomRange() {
  const wrap = $('boardWrap'), p = panelSize();
  let fit = Math.min(wrap.clientWidth / p.w, wrap.clientHeight / p.h);

  return { min: Math.min(1, Math.max(.12, fit)), max: ZMAX };
}

  const wrap = $('boardWrap'), p = panelSize(), z = (G && G.zoom) || 1;

    x: (wrap.clientWidth - w) / 2 + ((G && G.panX) || 0), y: (wrap.clientHeight - h) / 2 + ((G && G.panY) || 0),
    w, h, vw: wrap.clientWidth, vh: wrap.clientHeight
  };
}
function panLimit() {
  const wrap = $('boardWrap'), p = panelSize(), z = G.zoom || 1;
  return {
    x: Math.max(0, (p.w * z - wrap.clientWidth) / 2 + 14),
    y: Math.max(0, (p.h * z - wrap.clientHeight) / 2 + 14)

}
function setZoom(z, ax, ay) {

  const r = zoomRange(), z0 = G.zoom || 1, z1 = clamp(z, r.min, r.max);
  if (Math.abs(z1 - z0) < 1e-4) return;
  const wr = $('boardWrap').getBoundingClientRect();
  const cx = wr.left + wr.width / 2, cy = wr.top + wr.height / 2;
  const sx = (ax == null ? cx : ax), sy = (ay == null ? cy : ay), k = z1 / z0;

}

  G.panX = clamp(x || 0, -Lm.x, Lm.x);
  G.panY = clamp(y || 0, -Lm.y, Lm.y);
  const px = (wrap.clientWidth - p.w * z) / 2 + G.panX, py = (wrap.clientHeight - p.h * z) / 2 + G.panY;
  panel.style.transform = `translate(${px.toFixed(1)}px,${py.toFixed(1)}px) scale(${z.toFixed(3)})`;
  wrap.classList.toggle('pannable', Lm.x > 0 || Lm.y > 0);
}
function centerOn(o) {

  const k = G.cell, [hx, hy] = o.cells[0], z = G.zoom || 1;
  setPan(-((hx + .5) * k - G.cell * G.cols / 2) * z, -((hy + .5) * k - G.cell * G.rows / 2) * z);
}
function fitBoard(force) {
  if (!G) return;
  const r = zoomRange();
  if (r.min >= 1) { setZoom(1); return; }
  setZoom(force || Math.abs((G.zoom || 1) - r.min) > 0.02 ? r.min : 1);
  setPan(0, 0); redrawSoon();
}
let dotsT = null;
function redrawSoon() { clearTimeout(dotsT); dotsT = setTimeout(() => { if (G) { drawDots(); drawGrid(); } }, 150); }

/* ---------- 點陣格線 ---------- */
function canvasDpr(cv, w, h) {
  const want = Math.min(2, Math.max(1, (G.zoom || 1))) * (w * h > 1.6e6 ? 1 : Math.min(2, devicePixelRatio || 1));
  if (Math.abs((cv.__dpr || 0) - want) > 0.05) { cv.__dpr = want; cv.width = w * want; cv.height = h * want; }
  cv.style.width = w + 'px'; cv.style.height = h + 'px';

function drawDots() {
  const k = G.cell, w = k * G.cols, h = k * G.rows;
  const c = canvasDpr(dots, w, h);
  c.fillStyle = cssVar('--dot') || '#E6E5EC';
  const r = Math.max(1.1, k * .033);
  for (let y = 0; y < G.rows; y++) for (let x = 0; x < G.cols; x++) {
    c.beginPath(); c.arc((x + .5) * k, (y + .5) * k, r, 0, 7); c.fill();

function drawGrid() {
  const k = G.cell, w = k * G.cols, h = k * G.rows;
  const c = canvasDpr(gridc, w, h);
  if (!S.grid) return;
  c.strokeStyle = cssVar('--grid') || '#F1F1F8';

  for (let y = 0; y <= G.rows; y++) { c.moveTo(0, y * k + .5); c.lineTo(w, y * k + .5); }

/* ---------- 幾何：折線「尾 → 頭 → 盤外」，蛇身用 stroke-dash 只露出前段 ---------- */
const STROKE = .17, HEADLEN = .44, HEADHALF = .27;

function slide(o, to, ms, ease) {

const MW = $('mascot'), MI = $('mimg'), MB = $('mbub');
const ASP = { full: 1.30, side: 1.69, back: 1.30, head: 0.68 };

function findSlot(pose, text) {

  const W = wr.width, H = wr.height;
  if (W < 40 || H < 40) return [];
  const px = pr.left - wr.left, py = pr.top - wr.top, pw = pr.width, ph = pr.height;
  const gap = { L: px, R: W - (px + pw), T: py, B: H - (py + ph) }, bw = bubW(text);

      const w = Math.round(base * k), h = Math.round(w * ASP[pose]);

        const y = clamp(Math.round((H - h) / 2), BH + PAD, Math.max(BH + PAD, H - h));
        const cx = side === 'L' ? 0 : px + pw;

          side, w, h, x: Math.round(cx + (g - w) / 2), y,
          bx: Math.round(cx + (g - bw) / 2), by: y - BH - PAD, bw, tail: 'd', flip: side === 'L'
        });
        break;
      } else {
        if (Math.max(h, BH) > g - 4) continue;
        if (w + PAD + bw > W) continue;

        let x = Math.round(px + pw * .58), bx = x + w + PAD, tail = 'l';

        if (x < 0) x = 0;

}

/* ---------- 每日挑戰 ---------- */
let calMonth = null;
function buildDaily() {
  const now = new Date();
  if (!calMonth) calMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7;                 // 週一起算
  let doneN = 0;
  for (let d = 1; d <= days; d++) if (S.daily[dstamp(new Date(y, m, d))]) doneN++;
  const dow = S.lang === 'zh' ? ['一', '二', '三', '四', '五', '六', '日'] : ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  let cells = dow.map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < lead; i++) cells += '<div class="day blank"></div>';
  for (let d = 1; d <= days; d++) {
    const dt = new Date(y, m, d), st = dstamp(dt);
    const future = dt > now && st !== dstamp(now);
    const done = !!S.daily[st], today = st === dstamp(now);
    cells += `<div class="day${done ? ' done' : ''}${today ? ' today' : ''}${future ? ' future' : ''}"
      ${future ? '' : `data-d="${st}"`}>${d}</div>`;
  }
  const canPrev = true, canNext = !(y === now.getFullYear() && m === now.getMonth());
  const nextMid = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1) - now;
  const hh = Math.floor(nextMid / 3600000), mm = Math.floor(nextMid % 3600000 / 60000), ss = Math.floor(nextMid % 60000 / 1000);
  $('calBody').innerHTML =
    `<div class="calhead">
      <button class="calnav" id="calPrev" ${canPrev ? '' : 'disabled'}>‹</button>
      <b>${(MONTHS[S.lang] || MONTHS.en)[m]} ${y}</b>
      <button class="calnav" id="calNext" ${canNext ? '' : 'disabled'}>›</button>
    </div>
    <div class="calbar"><div class="n">${doneN}</div><div class="bar"><i style="width:${doneN / days * 100}%"></i></div><div>${days}</div></div>
    <div class="calgrid">${cells}</div>
    <div class="cd">${T('newLevelIn', hh, mm, ss)}</div>
    <div style="margin-top:16px"><button class="btn wide" id="calPlay">${T('play')}</button></div>
    <div class="sub" style="text-align:center;margin-top:10px">${S.lang === 'zh'
      ? '每日一關用日期當種子，全世界同一天同一關，難度固定在「硬派」帶。'
      : 'The daily level is seeded by the date — same board for everyone, always in the Brutal band.'}</div>`;
  $('calPrev').onclick = () => { calMonth = new Date(y, m - 1, 1); buildDaily(); };
  $('calNext').onclick = () => { calMonth = new Date(y, m + 1, 1); buildDaily(); };
  $('calPlay').onclick = () => playDaily(dstamp(now));
  $('calBody').querySelectorAll('.day[data-d]').forEach(el =>
    el.onclick = () => playDaily(el.dataset.d));
}

  actx(); go('game'); startLevel(0, { daily: stamp });
}

/* ---------- 聯盟賽（每週重置，對手由當週種子決定） ---------- */
function weekTag(d) {
  d = d || new Date();
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
  const w1 = new Date(t.getFullYear(), 0, 4);
  return t.getFullYear() + '-W' + String(1 + Math.round(((t - w1) / 86400000 - 3 + ((w1.getDay() + 6) % 7)) / 7)).padStart(2, '0');
}
function weekScore() {
  const tag = weekTag();
  if (S.weekTag !== tag) { S.weekTag = tag; S.weekScore = 0; save(); }
  return S.weekScore;
}
const LGNAMES = ['Nova', 'Pixel', 'Kite', 'Mochi', 'Rico', 'Juno', 'Bolt', 'Suki', 'Milo', 'Zara',
  'Kobe', 'Wren', 'Otto', 'Nala', 'Finn', 'Iris', 'Remy', 'Tova', 'Ezra', 'Lumi', 'Kai', 'Sage'];
function buildLeagues() {
  const pre = S.maxLv >= K.LeaguesPreview, ok = S.maxLv >= K.LeaguesUnlock;
  if (!pre) { $('lgBody').innerHTML = `<div class="tut">${T('lockedL', K.LeaguesPreview)}</div>`; $('lgSub').textContent = ''; $('lgTop').textContent = '—'; return; }
  const tag = weekTag(), seed = hash32(tag.split('').reduce((a, c) => a + c.charCodeAt(0), 0), 0x1ea9);
  const mine = weekScore();
  const base = Math.max(600, mine * 0.9 + 400);
  const rows = [];
  for (let i = 0; i < 19; i++) {
    const h = hash32(seed + i * 7919, 0x77);
    const nm = LGNAMES[h % LGNAMES.length] + (h >> 8) % 90;
    rows.push({ nm, sc: Math.round(base * (0.35 + (h % 1000) / 1000 * 1.5)), me: false });
  }
  rows.push({ nm: S.lang === 'zh' ? '我' : 'You', sc: mine, me: true });
  rows.sort((a, b) => b.sc - a.sc);
  const myRank = rows.findIndex(r => r.me) + 1;
  $('lgSub').innerHTML = `${tag} · ${T('week')} <b style="color:var(--ink)">${nfmt(mine)}</b>`
    + (ok ? '' : `<br><span style="color:var(--ink3)">${T('lockedLP', K.LeaguesUnlock)}</span>`);
  $('lgTop').textContent = T('topN', myRank);
  $('lgBody').innerHTML =
    `<div class="zone">${T('promo')}</div>` +
    rows.map((r, i) =>
      (i === 5 ? `<div class="zone" style="color:var(--ink3)">${T('hold')}</div>` : '') +
      `<div class="lgrow${r.me ? ' me' : ''}${i < 5 ? ' up' : ''}">
        <div class="r">${i + 1}</div><div class="nm">${r.nm}</div><div class="sc">${nfmt(r.sc)}</div>
      </div>`).join('');
}

      <b>4.</b> 被擋住就撞上去，<b>扣一顆愛心</b>；三顆用完可以免費補滿或整關重來。<br>
      <b>5.</b> 所以真正要做的事只有一件：<b>找出正確的清除順序</b>。<br>
      <b>6.</b> 移除箭頭只會<b>釋放</b>格子、永遠不會新增阻擋 → <b>不可能死局</b>，
      失敗只來自愛心，不來自順序。<br>
      <b>7.</b> 盤面比畫面大時：<b>按住空白處拖曳</b>移動、<b>雙指縮放</b>（桌機用滾輪），
      ⤢ 鈕在「整盤 ↔ 1×」之間切換。<br>
      <b>8.</b> 難度只看一個數字：<b>所有箭頭佔用的格數總和</b>。
      ${TIERCUT.join(' / ')} 三個門檻切成 ${tiers} 四段，
      跟盤面多大、箭頭幾支、彎幾次都無關。<br>
      <b>9.</b> 每 5 關安排一個<b>圖形關 ◆</b>（愛心、星星、月亮、幽靈、竹子…）：
      分段不變但只填一半，是節奏上的減壓閥。<br>
      <b>10.</b> 燈泡是<b>提示</b>，會亮出一支現在走得掉的箭頭並把鏡頭帶過去；
      井字鈕切換格線。<br>
      <span class="mini">關卡是內建生成器產生的，用關卡號當種子 ——
      <b>第 N 關對任何人永遠是同一關</b>，而且生成方式本身就保證有解。
      前 ${P ? P.n : 300} 關已經烘焙在檔案裡，之後的關卡開場前現場生成。
      旁邊那隻是<b>馬哥</b>，他只在棋盤外的空白處探頭，不會擋到盤面。</span>` : `
      <b>1.</b> Every polyline is one arrow — <b>the head points where it wants to leave</b>.<br>
      <b>2.</b> Tap it and the whole snake slides out <b>along its own body path</b>.<br>
      <b>3.</b> The only condition: the straight line ahead of the head must be
      <b>completely empty</b> all the way off the board.<br>
      <b>4.</b> Blocked means a bump and <b>one heart</b>. Out of hearts: refill free or restart.<br>
      <b>5.</b> So there is exactly one thing to figure out: <b>the right clearing order</b>.<br>
      <b>6.</b> Removing an arrow only <b>frees</b> cells, never blocks — so a dead end is
      impossible. You lose hearts, never the solution.<br>
      <b>7.</b> Bigger than the screen? <b>Drag any empty spot</b> to move, <b>pinch to zoom</b>
      (mouse wheel on desktop), ⤢ toggles whole-board view.<br>
      <b>8.</b> Difficulty is a single number: <b>the sum of all arrow lengths</b>.
      Cutoffs ${TIERCUT.join(' / ')} split it into ${tiers} —
      board size, arrow count and bends do not matter.<br>
      <b>9.</b> Every 5th level is a <b>shaped level ◆</b> — same tier, half the visual
      density: a pressure valve.<br>
      <b>10.</b> The bulb is the <b>hint</b>; the grid button toggles the grid lines.<br>
      <span class="mini">Levels come from the built-in generator, seeded by the level number —
      <b>level N is the same board for everyone</b>, and the way it is built guarantees a
      solution exists. The first ${P ? P.n : 300} levels are baked into the file; later ones are
      generated on the spot. The little guy is <b>Mago</b> — he only pops up in the empty band
      outside the board.</span>`}</div>
    <div class="cardbtns"><button class="btn" data-a="close">${T('close')}</button></div>`);
}

/* ---------- 按鈕 ---------- */
$('btnPlay').addEventListener('click', () => { actx(); go('game'); startLevel(Math.max(1, S.cur)); });
$('btnHow').addEventListener('click', howto);
$('btnSet').addEventListener('click', settings);
$('tMap').addEventListener('click', () => go('map'));
$('tDaily').addEventListener('click', () => {
  if (S.maxLv < K.DailyUnlock) { floatHint(T('lockedD', K.DailyUnlock)); return; }
  calMonth = null; go('daily');
});
$('tAward').addEventListener('click', () => {
  if (S.maxLv < K.AwardsUnlock) { floatHint(T('lockedA', K.AwardsUnlock)); return; }
  go('awards');
});
$('tLeague').addEventListener('click', () => {
  if (S.maxLv < K.LeaguesPreview) { floatHint(T('lockedL', K.LeaguesPreview)); return; }
  go('leagues');
});
document.querySelectorAll('[data-back]').forEach(b =>
  b.addEventListener('click', () => go(b.dataset.back)));
$('btnBack').addEventListener('click', () => { hush(); go(G && G.daily ? 'daily' : 'map'); });
$('btnRestart').addEventListener('click', askRestart);
/* ⤢：盤面比畫面大時在「整盤 ↔ 1×」之間切；本來就看得完時就當放大鏡用。
   一定要給回饋，不然小關卡按下去看起來像壞的。 */
$('btnFit').addEventListener('click', () => {
  if (!G) return;
  SFX.tap();
  const r = zoomRange(), z = G.zoom || 1;
  if (r.min >= 1) {                       // 整盤本來就放得下
    const zoomIn = z <= 1.05;
    setZoom(zoomIn ? 1.8 : 1);
    setPan(0, 0); redrawSoon();
    toast(T(zoomIn ? 'zoomIn' : 'zoomOut'), 1300);
    return;
  }
  const wasFit = Math.abs(z - r.min) < 0.02;
  fitBoard();
  toast(T(wasFit ? 'zoom1x' : 'fitWhole'), 1300);
});
$('btnGrid').addEventListener('click', () => {
  S.grid = !S.grid; save(); SFX.tap();
  $('btnGrid').classList.toggle('on', S.grid);
  if (G) drawGrid();
  toast(T(S.grid ? 'gridOn' : 'gridOff'), 1300);
});
$('btnHint').addEventListener('click', () => {
  if (!G || G.busy || G.over) return;
  if (S.hints <= 0) { floatHint(T('hintNone')); return; }
  const opts = anyMove(); if (!opts.length) return;
  S.hints--; save(); updHud(); SFX.ding();
  const p = opts[R(opts.length)];
  centerOn(p);
  p.g.classList.add('tip'); clearGuide(); showGuide(p);
  say(pick('hint'), { prio: 2, pose: 'head', dur: 2200 });
  setTimeout(() => { p.g.classList.remove('tip'); clearGuide(); }, 2600);
});

/* ---------- 輸入：一指拖曳＝平移，兩指＝縮放，放開沒拖過才算點擊 ---------- */
let PEND = null, DRAG = null, DRAGGED = false, PINCH = null;
const PTRS = new Map();
const DRAGMIN = 8;
const pid = ev => ev.pointerId == null ? 1 : ev.pointerId;
function pinchInfo() {
  const a = [...PTRS.values()];
  if (a.length < 2) return null;
  return { d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1, mx: (a[0].x + a[1].x) / 2, my: (a[0].y + a[1].y) / 2 };
}
$('boardWrap').addEventListener('pointerdown', ev => {
  if (!G || G.over) return;
  PTRS.set(pid(ev), { x: ev.clientX || 0, y: ev.clientY || 0 });
  if (PTRS.size === 2) {
    const p = pinchInfo();
    PINCH = { d0: p.d, z0: G.zoom || 1 }; DRAG = null; DRAGGED = false; PEND = null; clearGuide();
    $('boardWrap').classList.remove('panning');
    return;
  }
  if (PTRS.size === 1) { DRAG = { x: ev.clientX || 0, y: ev.clientY || 0, px: G.panX || 0, py: G.panY || 0 }; DRAGGED = false; }
});
addEventListener('pointermove', ev => {
  if (!G) return;
  if (PTRS.has(pid(ev))) PTRS.set(pid(ev), { x: ev.clientX || 0, y: ev.clientY || 0 });
  if (PINCH && PTRS.size >= 2) { const p = pinchInfo(); setZoom(PINCH.z0 * p.d / PINCH.d0, p.mx, p.my); return; }
  if (!DRAG) return;
  const dx = (ev.clientX || 0) - DRAG.x, dy = (ev.clientY || 0) - DRAG.y;
  if (!DRAGGED && Math.abs(dx) + Math.abs(dy) > DRAGMIN) {
    const Lm = panLimit();
    if (!Lm.x && !Lm.y) { DRAG = null; return; }
    DRAGGED = true; PEND = null; clearGuide();
    $('boardWrap').classList.add('panning');
  }
  if (DRAGGED) setPan(DRAG.px + dx, DRAG.py + dy);
});
function endDrag() {
  const o = PEND, was = DRAGGED || PINCH;
  PEND = null; DRAG = null; DRAGGED = false;
  $('boardWrap').classList.remove('panning');
  if (!was && o) onTap(o);
}
addEventListener('pointerup', ev => {
  PTRS.delete(pid(ev));
  if (PTRS.size < 2 && PINCH) { PINCH = null; DRAG = null; PEND = null; redrawSoon(); }
  if (PTRS.size === 0 && (DRAG || PEND || !PINCH)) endDrag();
});
addEventListener('pointercancel', ev => {
  PTRS.delete(pid(ev)); PINCH = null; PEND = null; DRAG = null; DRAGGED = false;
  $('boardWrap').classList.remove('panning');
});
$('boardWrap').addEventListener('wheel', ev => {
  if (!G || G.over) return;
  ev.preventDefault();
  setZoom((G.zoom || 1) * Math.exp(-(ev.deltaY || 0) * 0.0016), ev.clientX, ev.clientY);
  redrawSoon();
}, { passive: false });
let holdT = null;
svg.addEventListener('pointerdown', e => {
  if (!S.guide || !G) return;
  const g = e.target.closest('.pc'); if (!g) return;
  const o = G.items.find(i => i.g === g); if (!o) return;
  holdT = setTimeout(() => showGuide(o), 140);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
  svg.addEventListener(ev, () => { clearTimeout(holdT); setTimeout(clearGuide, 60); }));
addEventListener('resize', () => { resizeFx(); if (G) layout(true); });
addEventListener('orientationchange', () => setTimeout(() => { resizeFx(); if (G) layout(true); }, 250));
document.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('modal').classList.contains('on')) closeModal(); else if ($('game').classList.contains('on')) go('map'); }
  if (e.key === 'h' && $('game').classList.contains('on')) $('btnHint').click();
  if (e.key === 'r' && $('game').classList.contains('on')) askRestart();
  if (e.key === 'f' && $('game').classList.contains('on')) $('btnFit').click();
});

/* ---------- 竹葉裝飾（只在框內，不吃點擊） ---------- */
(function leaves() {
  const svg = '<svg viewBox="0 0 40 100" fill="currentColor"><path d="M20 0C6 24 0 52 8 78c4 13 10 19 12 22 2-3 8-9 12-22C40 52 34 24 20 0z"/></svg>';
  [[2, 5, 118, -18], [86, -4, 148, 24], [-5, 60, 168, 12], [80, 66, 138, -30]].forEach(([l, t, z, r]) => {
    const d = document.createElement('div');
    d.className = 'leaf';
    d.style.cssText = `left:${l}%;top:${t}%;width:${z}px;transform:rotate(${r}deg)`;
    d.innerHTML = svg;
    $('app').appendChild(d);
  });
})();

/* ---------- 開機 ---------- */
$('heroImg').src = SPRITES.full;
applyLang(); applyTheme(); resizeFx();
loadPack().then(() => {
  $('splash').classList.add('off');
  go('home');
  if (typeof window !== 'undefined') window.__MAGO = {
    S, K, slotOf, levelSource, generate, decodeLevel, tierOf, pickTier, anyMove, pathOf,
    newLevel, boardBox, findSlot, awardList, weekTag, dailySeed, solvableLv, branchProfile,
    get P() { return P; }, get G() { return G; }, get ac() { return ac; }, unlockAudio
  };
}).catch(err => {
  $('splash').innerHTML = `<div style="padding:26px;text-align:center;font-size:13px;line-height:1.7">
    <b>關卡包解不開</b><br><span style="color:var(--ink2)">${err && err.message ? err.message : err}</span><br><br>
    這個檔案需要瀏覽器支援 DecompressionStream（Chrome 80+／Edge／Safari 16.4+／Firefox 113+）。</div>`;
  console.error(err);
});

</script>
